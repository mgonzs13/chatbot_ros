/**:
  ros__parameters:
    # Model parameters
    model:
      repo: mradermacher/MiniCPM5-2B-i1-GGUF
      filename: MiniCPM5-2B.i1-Q4_0.gguf

    # Context / inference parameters
    context:
      n_ctx: 4096
      n_batch: 256
      # Cap the answer length: the chatbot is voice oriented and long
      # monologues are hard to interrupt and tedious to listen to.
      n_predict: 256

    # GPU / backend parameters
    gpu:
      n_gpu_layers: -1

    # CPU parameters
    cpu:
      n_threads: -1

    # Prompt & chat parameters
    prompt:
      system_prompt_type: ChatML
